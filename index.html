<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 450px;
            height: 600px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chat-header {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .chat-header h1 {
            font-size: 1.5rem;
        }

        .chat-header p {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .user-message {
            background: #00d4ff;
            color: #1a1a2e;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: rgba(255,255,255,0.1);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .typing {
            background: rgba(255,255,255,0.1);
            color: #00d4ff;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            font-style: italic;
        }

        .chat-input {
            padding: 15px;
            background: rgba(255,255,255,0.05);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .chat-input button {
            padding: 12px 20px;
            background: #00d4ff;
            border: none;
            border-radius: 25px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .chat-input button:hover {
            background: #00b8d9;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Chatbot</h1>
            <p>Powered by Claude AI</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">
                Hi! I am your AI assistant! 👋 How can I help you today?
            </div>
        </div>
        <div class="chat-input">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your message..."
                onkeypress="handleKeyPress(event)"
            >
            <button onclick="sendMessage()">Send 🚀</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function addMessage(text, isUser) {
            const message = document.createElement('div');
            message.classList.add('message');
            message.classList.add(isUser ? 'user-message' : 'ai-message');
            message.textContent = text;
            chatMessages.appendChild(message);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addTyping() {
            const typing = document.createElement('div');
            typing.classList.add('message', 'typing');
            typing.id = 'typing';
            typing.textContent = 'AI is typing...';
            chatMessages.appendChild(typing);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            addTyping();

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': 'AIzaSyAfIQ8MchQPtO4SzxCu5CEBJ0P5fVPP6IE',
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 500,
                        messages: [
                            {
                                role: 'user',
                                content: message
                            }
                        ]
                    })
                });

                const data = await response.json();
                removeTyping();
                addMessage(data.content[0].text, false);

            } catch (error) {
                removeTyping();
                addMessage('Sorry, something went wrong! Please try again.', false);
            }
        }
    </script>
</body>
</html>
